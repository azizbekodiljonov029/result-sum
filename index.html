<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="../css/normalize.css">
    <link rel="stylesheet" href="../css/main.css">
    
</head>
<body>
    <div class="container">
        <div class="box-image">
            <img class="img" src="./images/png/img-card.png" alt="">
        </div>
        <div class="box-description">
            <h1>Summary</h1>
            <div class="cart-box">
                <div class="red-card">
                    <img class="flash" src="./images/svg/flash.svg" alt="">
                    <p class="text-sec">Reaction</p>
                    <p class="flesh-text">80 <span>/ 100</span></p>
                </div>

                 <div class="memory-card">
                    <img  src="./images/svg/memory.svg" alt="">
                    <p class="memory">Memory</p>
                    <p class="memory-text">92  <span>/ 100</span></p>
                </div>
                 
                 <div class="verable-card">
                    <img src="./images/svg/chat.svg" alt="">
                    <p class="verable">Verbal</p>
                    <p class="verable-text">61 <span>/ 100</span></p>
                </div>
                 
                 <div class="visual-card">
                    <img src="./images/svg/see.svg" alt="">
                    <p class="visual">Visual</p>
                    <p class="visual-text">73 <span>/ 100</span></p>
                </div>
                
            </div>
            <button class="memory">Continue</button>
        </div>

    </div>
    <!-- js ulanishi  -->
    <script src="../main.js"></script>
</body>
</html>
